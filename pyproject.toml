[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "pastebin-service"
version = "0.2.0"
description = "A small self-hosted Pastebin API backed by PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.0.54",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
